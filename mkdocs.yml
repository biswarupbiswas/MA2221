site_name: MA2221 — Foundational Mathematics for Machine Learning
site_url: https://biswarupbiswas.github.io/MA2221

repo_url: https://github.com/biswarupbiswas/MA2221
# edit_uri: blob/main/docs/

copyright: Copyright &copy; 2026 Biswarup Biswas # Add this at the top level

theme:
  name: material
  custom_dir: overrides
  logo: assets/MFML_logo.png
  favicon: assets/MFML_logo.png
  palette:
    scheme: default
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - content.code.copy
    - footer.hide.generator # The "new" way

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      # Note: include_mathjax is removed to avoid the 'Unrecognised' warning

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Lectures: lectures.md
  - Tutorials: tutorials.md
  - Assignments: assignments.md
  - Notebooks:
      - Lab 1: notebooks/notebook1.ipynb
      - Lab 2: notebooks/notebook2.ipynb
      - Lab 3: notebooks/notebook3.ipynb
      - Lab 4: notebooks/SVD_Application.ipynb
      - Lab 5: notebooks/notebook5.ipynb
      - Lab 6: notebooks/GradientsOptimisation.ipynb
      - Lab 7: notebooks/notebook_DataHandling.ipynb
      - Lab 8: notebooks/notebook_probability.ipynb
      - Lab 9: notebooks/notebook_ML_Pipeline.ipynb
      - Lab 10: notebooks/notebook_PCA.ipynb
      - SVM: notebooks/hard_margin_svm.ipynb
      
  # - Codes: codes.md
  - Flashcards:
      - Linear Algebra: flashcards/linear_algebra.md
      - Norm and Inner Product: flashcards/Norms.md
      - Matrix Factorisation: flashcards/matrix_fact.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - attr_list

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/biswarupbiswas
    - icon: fontawesome/solid/envelope
      link: mailto:biswarup.biswas@mahindrauniversity.edu.in
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/dr-biswarup-biswas
